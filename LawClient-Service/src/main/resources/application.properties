#Basic Config
spring.application.name=LawClient-Service
server.port=8013

#Eureka Configuration
eureka.client.serviceUrl.defaultZone=http://127.0.0.1:8761/eureka

# Spring Data MongoDB configuration
spring.data.mongodb.uri=mongodb://localhost:27017/LawCLients
spring.data.mongodb.database=lawofficedb
spring.data.mongodb.auto-index-creation=true

# Optional: Logging for MongoDB queries
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG
logging.level.org.mongodb.driver=INFO

#Open APi Config
# Include actuator endpoints (if you use Spring Boot Actuator)
springdoc.show-actuator=true
springdoc.api-docs.path=/api-docs

#Actuator + Prometheus
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoint.prometheus.access=unrestricted

#Zipkin Config
spring.zipkin.endpoint=http://localhost:9411/api/v2/spans
management.tracing.sampling.probability=1.0

#Resilinece4j Properties
resilience4j.circuitbreaker.instances.lawclient.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.lawclient.event-consumer-buffer-size=10
resilience4j.circuitbreaker.instances.lawclient.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.lawclient.slidingWindowSize=10
resilience4j.circuitbreaker.instances.lawclient.failureRateThreshold=50
resilience4j.circuitbreaker.instances.lawclient.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.lawclient.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.lawclient.automaticTransitionFromOpenToHalfOpenEnabled=true

resilience4j.retry.configs.default.maxAttempts=3
resilience4j.retry.configs.default.waitDuration=500ms
resilience4j.retry.configs.default.enableExponentialBackoff=true
resilience4j.retry.configs.default.exponentialBackoffMultiplier=2
resilience4j.retry.instances.lawclient.baseConfig=default

resilience4j.ratelimiter.configs.default.limitForPeriod=5
resilience4j.ratelimiter.configs.default.limitRefreshPeriod=1s
resilience4j.ratelimiter.configs.default.timeoutDuration=0
resilience4j.ratelimiter.instances.lawclient.baseConfig=default
