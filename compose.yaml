services:
  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
  zipkin:
    image: 'openzipkin/zipkin:latest'
    ports:
      - '9411:9411'
  prometheus:
    image: prom/prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
  grafana:
    image: grafana/grafana
    ports:
      - "3001:3001"